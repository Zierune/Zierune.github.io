<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zierune — Chrono Archive</title>
  <meta name="description" content="Zi Eer (@Zierune): lịch stream, TikTok, YouTube, Discord, donate — mọi thứ ở một nơi.">
  <link rel="icon" href="./avatar.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,700;0,800;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --glass:        rgba(255,255,255,0.08);
      --glass-mid:    rgba(255,255,255,0.13);
      --glass-strong: rgba(255,255,255,0.22);
      --border:       rgba(255,255,255,0.18);
      --border-mid:   rgba(255,255,255,0.32);
      --text:         rgba(255,255,255,0.96);
      --text-mid:     rgba(255,255,255,0.72);
      --text-dim:     rgba(255,255,255,0.48);
      --blue:         #BDBDBD;
      --blue-lt:      #DADADA;
      --shadow:       0 8px 32px rgba(0,0,0,0.18);
      --shadow-lg:    0 16px 48px rgba(0,0,0,0.22);
      --ts: 0 1px 8px rgba(0,0,0,0.35);   /* text shadow */
    }

    html, body { height: 100%; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: #141414;
    }

    /* ═══════════════════════
       BACKGROUND — gallery photo
    ═══════════════════════ */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      background:
        linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.38)),
        url("./bg.webp") center / cover no-repeat;
    }

    /* ═══════════════════════
       DOODLE LAYER
    ═══════════════════════ */
    .doodle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .doodle {
      position: absolute;
      opacity: 0;
      animation: floatDoodle var(--dur, 8s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes floatDoodle {
      0%   { opacity: 0;    transform: translateY(0px) rotate(0deg)   scale(1); }
      15%  { opacity: 0.55; }
      50%  { opacity: 0.45; transform: translateY(-18px) rotate(8deg)  scale(1.05); }
      85%  { opacity: 0.55; }
      100% { opacity: 0;    transform: translateY(0px) rotate(0deg)   scale(1); }
    }

    /* ═══════════════════════
       APP WRAPPER
    ═══════════════════════ */
    .app {
      position: relative;
      z-index: 2;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 2.4rem;
    }

    /* ═══════════════════════
       NAV — glass
    ═══════════════════════ */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.6rem;
      margin: 1.2rem 0 0;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 2.2rem;
    }

    .nav-links li { position: relative; }

    .nav-links a {
      font-size: .8rem;
      font-weight: 400;
      letter-spacing: .05em;
      color: var(--text-mid);
      text-decoration: none;
      transition: color .2s;
      text-shadow: var(--ts);
    }

    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); font-weight: 600; }

    .nav-links li.active-dot::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 6px rgba(255,255,255,0.8);
    }

    .nav-profile { display: flex; align-items: center; gap: .8rem; }

    .nav-text { text-align: right; }

    .nav-handle {
      font-size: .8rem; font-weight: 600;
      color: var(--text);
      text-shadow: var(--ts);
    }

    .nav-sub {
      font-size: .68rem;
      color: var(--text-mid);
      margin-top: .1rem;
      letter-spacing: .05em;
      text-shadow: var(--ts);
    }

    .nav-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--glass-mid);
      backdrop-filter: blur(10px);
      border: 1.5px solid var(--border-mid);
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem; font-weight: 800;
      color: white;
      text-shadow: var(--ts);
      box-shadow: var(--shadow);
    }

    /* ═══════════════════════
       STAGE
    ═══════════════════════ */
    .stage {
      position: relative;
      min-height: 660px;
      margin-top: 1.4rem;
    }

    /* ═══════════════════════
       VINYL
    ═══════════════════════ */
    .vinyl-wrap {
      position: absolute;
      left: -75px; top: -15px;
      width: 430px; height: 430px;
      z-index: 3;
    }

    .vinyl-svg {
      width: 100%; height: 100%;
      animation: vinylSpin 26s linear infinite, vinylGlow 3s ease-in-out infinite;
    }

    .vinyl-svg.paused {
      animation-play-state: paused;
    }

    @keyframes vinylSpin { to { transform: rotate(360deg); } }

    @keyframes vinylGlow {
      0%, 100% {
        filter:
          drop-shadow(0 0 10px rgba(255,255,255,0.35))
          drop-shadow(0 0 25px rgba(255,255,255,0.15));
      }
      50% {
        filter:
          drop-shadow(0 0 20px rgba(255,255,255,0.6))
          drop-shadow(0 0 50px rgba(255,255,255,0.25));
      }
    }

    /* Arc (static) */
    .arc-svg {
      position: absolute; inset: -8px;
      width: calc(100% + 16px);
      height: calc(100% + 16px);
      pointer-events: none; z-index: 4;
      animation: arcPulse 3s ease-in-out infinite;
    }

    @keyframes arcPulse {
      0%, 100% { opacity: 0.75; }
      50%       { opacity: 1; }
    }

    /* EQ bars (show when playing) */
    .eq-bars {
      position: absolute;
      bottom: 30px; right: -10px;
      display: flex; gap: 3px; align-items: flex-end;
      height: 24px; z-index: 5;
      opacity: 0;
      transition: opacity .5s;
    }

    .eq-bars.visible { opacity: 1; }

    .eq-bar {
      width: 4px;
      border-radius: 2px;
      background: white;
      box-shadow: 0 0 6px rgba(255,255,255,0.6);
    }

    .eq-bar:nth-child(1) { animation: eq1 0.9s ease-in-out infinite; height: 8px; }
    .eq-bar:nth-child(2) { animation: eq2 0.7s ease-in-out infinite; height: 14px; }
    .eq-bar:nth-child(3) { animation: eq3 1.1s ease-in-out infinite; height: 10px; }
    .eq-bar:nth-child(4) { animation: eq4 0.8s ease-in-out infinite; height: 18px; }
    .eq-bar:nth-child(5) { animation: eq5 1.0s ease-in-out infinite; height: 6px; }

    @keyframes eq1 { 0%,100%{height:8px} 50%{height:20px} }
    @keyframes eq2 { 0%,100%{height:14px} 50%{height:6px} }
    @keyframes eq3 { 0%,100%{height:10px} 50%{height:22px} }
    @keyframes eq4 { 0%,100%{height:18px} 50%{height:8px} }
    @keyframes eq5 { 0%,100%{height:6px} 50%{height:16px} }

    /* Controls */
    .vinyl-controls {
      position: absolute;
      bottom: 26px; left: 62px;
      display: flex; gap: .5rem; z-index: 5;
    }

    .ctrl {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border-mid);
      background: var(--glass-mid);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .22s;
      box-shadow: var(--shadow);
    }

    .ctrl:hover {
      background: var(--glass-strong);
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25), 0 0 0 2px rgba(255,255,255,0.3);
    }

    .ctrl svg { width: 12px; height: 12px; }

    /* Now playing label */
    .now-playing {
      position: absolute;
      bottom: 20px; left: 108px;
      font-size: .68rem;
      color: var(--text-mid);
      text-shadow: var(--ts);
      opacity: 0;
      transition: opacity .5s;
      letter-spacing: .05em;
    }

    .now-playing.visible { opacity: 1; }

    /* ═══════════════════════
       INFO SECTION — glass card
    ═══════════════════════ */
    .info-section {
      position: absolute;
      left: 322px; top: 70px;
      max-width: 290px;
      z-index: 3;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.6rem 1.5rem;
      box-shadow: var(--shadow-lg);
    }

    .rec-num {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.05;
      letter-spacing: -.02em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .rec-by {
      font-size: .8rem;
      color: var(--text-mid);
      font-style: italic;
      font-weight: 300;
      margin: .3rem 0 1rem;
      text-shadow: var(--ts);
    }

    .rec-desc {
      font-size: .86rem;
      line-height: 1.95;
      color: var(--text-mid);
      font-weight: 300;
      text-shadow: var(--ts);
    }

    .rec-more {
      display: inline-block;
      margin-top: .9rem;
      color: var(--text);
      font-style: italic;
      font-size: .8rem;
      text-decoration: none;
      cursor: pointer;
      transition: opacity .2s;
      text-shadow: var(--ts);
      font-weight: 500;
    }

    .rec-more:hover { opacity: .65; }

    /* ═══════════════════════
       SUBSCRIBE BTN — glass
    ═══════════════════════ */
    .sub-btn {
      position: absolute;
      left: 322px; top: 390px;
      z-index: 3;
      padding: .85rem 2rem;
      background: var(--glass-mid);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid var(--border-mid);
      border-radius: 100px;
      color: var(--text);
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: .83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .25s;
      box-shadow: var(--shadow);
      text-shadow: var(--ts);
      letter-spacing: .02em;
    }

    .sub-btn:hover {
      background: var(--glass-strong);
      box-shadow: var(--shadow-lg), 0 0 0 2px rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    /* ═══════════════════════
       SEARCH — glass
    ═══════════════════════ */
    .search-bar {
      position: absolute;
      bottom: 24px; left: 8px; right: 380px;
      z-index: 3;
      display: flex; align-items: center; gap: .9rem;
      padding: .88rem 1.3rem;
      background: var(--glass-mid);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1.5px solid var(--border-mid);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: all .25s;
    }

    .search-bar:focus-within {
      background: var(--glass-strong);
      box-shadow: var(--shadow-lg), 0 0 0 2px rgba(255,255,255,0.25);
    }

    .search-ico { flex-shrink: 0; opacity: .7; }

    .search-inp {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text);
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: .87rem; font-weight: 300;
    }

    .search-inp::placeholder { color: var(--text-dim); font-style: italic; }

    .search-x {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: var(--text-mid);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; transition: background .2s; flex-shrink: 0;
    }

    .search-x:hover { background: rgba(255,255,255,0.3); color: white; }

    /* ═══════════════════════
       RIGHT PANEL — glass
    ═══════════════════════ */
    .right-panel {
      position: absolute;
      right: 0; top: 0;
      width: 330px; z-index: 3;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.5rem 1.3rem 1.2rem;
      box-shadow: var(--shadow-lg);
    }

    .panel-title {
      font-size: 1.6rem; font-weight: 800;
      color: var(--text);
      margin-bottom: .3rem;
      letter-spacing: -.01em;
      font-style: italic;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .week-label {
      font-size: .7rem;
      color: var(--text-dim);
      letter-spacing: .07em;
      margin-bottom: .85rem;
      text-shadow: var(--ts);
    }

    /* ─── SCHEDULE ROWS ─── */
    .sched-list { display: flex; flex-direction: column; gap: .45rem; }

    .srow {
      display: flex; align-items: center; gap: .72rem;
      padding: .6rem .85rem;
      border-radius: 12px;
      transition: all .22s;
      cursor: default;
    }

    .srow.offline {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .srow.stream {
      background: var(--glass-mid);
      border: 1.5px solid var(--border-mid);
      box-shadow: 0 4px 20px rgba(0,0,0,0.12),
                  inset 0 0 20px rgba(255,255,255,0.06);
    }

    .srow.stream:hover {
      background: var(--glass-strong);
      transform: translateX(3px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.16);
    }

    /* Day badge */
    .day-badge { width: 36px; flex-shrink: 0; text-align: center; }

    .day-name {
      font-size: .65rem; font-weight: 700;
      letter-spacing: .07em;
      color: var(--text);
      text-shadow: var(--ts);
    }

    .day-date {
      font-size: .58rem;
      color: var(--text-dim);
      margin-top: .04rem;
      text-shadow: var(--ts);
    }

    .srow.offline .day-name { color: var(--text-dim); }

    /* Divider */
    .day-div {
      width: 1px; height: 26px; flex-shrink: 0;
      background: rgba(255,255,255,0.25);
    }

    .srow.offline .day-div { background: rgba(255,255,255,0.12); }

    /* Row content */
    .srow-info { flex: 1; }

    .srow-activity {
      font-size: .8rem; font-weight: 600;
      color: var(--text);
      text-shadow: var(--ts);
    }

    .srow.offline .srow-activity {
      font-size: .76rem; font-weight: 300;
      color: var(--text-dim); font-style: italic;
    }

    .srow-sub {
      font-size: .65rem; color: var(--text-mid);
      margin-top: .08rem; text-shadow: var(--ts);
    }

    /* Time badge */
    .time-badge {
      font-size: .7rem; font-weight: 700;
      color: white;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      padding: .2rem .5rem;
      flex-shrink: 0;
      text-shadow: none;
      backdrop-filter: blur(6px);
    }

    /* ─── NOW PLAYING BADGE in right panel ─── */
    .np-badge {
      margin-top: 1rem;
      display: flex; align-items: center; gap: .5rem;
      padding: .6rem .9rem;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      opacity: 0;
      transition: opacity .5s;
    }

    .np-badge.visible { opacity: 1; }

    .np-bars {
      display: flex; gap: 2px; align-items: flex-end; height: 16px;
    }

    .np-bar {
      width: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.8);
    }

    .np-bar:nth-child(1) { animation: eq1 0.9s ease-in-out infinite; }
    .np-bar:nth-child(2) { animation: eq2 0.7s ease-in-out infinite; }
    .np-bar:nth-child(3) { animation: eq3 1.1s ease-in-out infinite; }

    .np-text {
      font-size: .7rem; color: var(--text-mid);
      font-style: italic; text-shadow: var(--ts);
    }

    /* ─── FOOTER QUOTE ─── */
    .footer-quote {
      margin-top: 1rem;
      text-align: right;
      font-style: italic;
      font-size: .7rem; line-height: 2;
      color: var(--text-dim);
      text-shadow: var(--ts);
    }

    /* ═══════════════════════
       VOLUME CONTROL
    ═══════════════════════ */
    .vol-control {
      position: absolute;
      bottom: 26px; right: 0;
      width: 330px; z-index: 3;
      display: flex; align-items: center; gap: .7rem;
      padding: .7rem 1rem;
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .vol-ico { font-size: .85rem; opacity: .75; flex-shrink: 0; }

    .vol-slider {
      flex: 1; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: rgba(255,255,255,0.25);
      border-radius: 2px; outline: none; cursor: pointer;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    /* ═══════════════════════
       RESPONSIVE
    ═══════════════════════ */
    @media (max-width: 780px) {
      .stage { min-height: auto; }
      .vinyl-wrap { position: relative; left: 0; top: 0; width: 280px; height: 280px; margin: 0 auto 1rem; }
      .info-section, .sub-btn, .search-bar, .right-panel, .vol-control {
        position: relative; left: auto; right: auto; top: auto; bottom: auto;
        margin: 1rem 0; width: 100%; max-width: 100%;
      }
    }

    /* ═══════════════════════
       AVATAR (ảnh thật)
    ═══════════════════════ */
    .sub-btn { white-space: nowrap; }
    /* gọn bảng lịch để không đè lên thanh âm lượng khi tuần có nhiều stream */
    .sched-list { gap: .25rem; }
    .np-badge { margin-top: .7rem; }
    .footer-quote { margin-top: .5rem; }
    .app { padding-bottom: 96px; }   /* chừa chỗ cho dải cột sóng ở chân trang */

    /* ═══════════════════════
       BEAT BAR — cột sóng chạy theo nhạc
    ═══════════════════════ */
    #beatBar {
      position: fixed; left: 50%; bottom: 10px;
      transform: translateX(-50%);
      width: min(560px, 82vw); height: 96px;
      z-index: 1; pointer-events: none;
    }

    img.nav-avatar { object-fit: cover; object-position: 40% 30%; display: block; }

    /* ═══════════════════════
       SEARCH RESULTS — glass dropdown
    ═══════════════════════ */
    .search-results {
      position: absolute;
      left: 0; right: 0; bottom: calc(100% + 10px);
      display: none;
      flex-direction: column; gap: .25rem;
      padding: .5rem;
      background: rgba(22,22,22,0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-mid);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      max-height: 340px; overflow-y: auto;
    }
    .search-results.open { display: flex; }
    .sr-item {
      display: flex; align-items: center; gap: .8rem;
      padding: .55rem .7rem;
      border-radius: 11px;
      color: var(--text); text-decoration: none;
      transition: background .18s;
    }
    .sr-item:hover, .sr-item.hl { background: rgba(255,255,255,0.12); }
    .sr-ico, .lt-ico {
      width: 32px; height: 32px; flex-shrink: 0;
      border-radius: 9px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .sr-ico svg, .lt-ico svg { width: 17px; height: 17px; }
    .sr-txt { flex: 1; min-width: 0; }
    .sr-name { font-size: .8rem; font-weight: 600; }
    .sr-url { font-size: .66rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr-go { font-size: .8rem; color: var(--text-mid); }
    .sr-empty { padding: .7rem .8rem; font-size: .76rem; font-style: italic; color: var(--text-dim); }

    /* ═══════════════════════
       HOME — all links overlay
    ═══════════════════════ */
    .links-overlay {
      position: fixed; inset: 0; z-index: 30;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 16px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; visibility: hidden;
      transition: opacity .3s, visibility .3s;
    }
    .links-overlay.open { opacity: 1; visibility: visible; }
    .links-box {
      position: relative;
      width: min(680px, 100%); max-height: 100%;
      overflow-y: auto; overflow-x: hidden;
      padding: 6px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent;
      transform: translateY(16px);

(function paintBg() {
  const cv = document.getElementById("bgCanvas");
  if (!cv.getContext) return;   // nền giờ là ảnh gallery (bg.webp)
  const ctx = cv.getContext("2d");
  let W, H;

  function paint() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;

    // Base sky gradient
    const base = ctx.createLinearGradient(0, 0, W * 0.7, H);
    base.addColorStop(0,   "#C8D4E4");
    base.addColorStop(0.4, "#B4C3D6");
    base.addColorStop(1,   "#A0B2C8");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, W, H);

    // Cloud patches — dark blue blobs
    const darkCloud = [
      "rgba(75, 95, 130, 0.17)",
      "rgba(85,105,140, 0.13)",
      "rgba(65, 85, 120, 0.20)",
      "rgba(95,115,150, 0.10)",
      "rgba(55, 78, 115, 0.22)",
    ];

    const lightCloud = [
      "rgba(215,228,242, 0.22)",
      "rgba(200,218,238, 0.18)",
    ];

    const cloudDefs = [
      { x:.28,y:.22,rx:.26,ry:.20,dark:true  },
      { x:.52,y:.40,rx:.22,ry:.25,dark:true  },
      { x:.08,y:.58,rx:.30,ry:.22,dark:true  },
      { x:.72,y:.52,rx:.20,ry:.18,dark:true  },
      { x:.42,y:.70,rx:.24,ry:.20,dark:true  },
      { x:.60,y:.18,rx:.18,ry:.14,dark:false },
      { x:.88,y:.35,rx:.22,ry:.16,dark:true  },
      { x:.15,y:.30,rx:.20,ry:.16,dark:false },
      { x:.35,y:.85,rx:.28,ry:.18,dark:true  },
      { x:.78,y:.78,rx:.18,ry:.22,dark:false },
    ];

    // Enable blur for watercolor bleed
    cloudDefs.forEach((b, i) => {
      ctx.save();
      ctx.filter = `blur(${Math.random()*10+6}px)`;
      const colors = b.dark ? darkCloud : lightCloud;
      const col = colors[i % colors.length];
      const cx = b.x * W, cy = b.y * H;
      const rx = b.rx * W, ry = b.ry * H;

      for (let j = 0; j < 6; j++) {
        const jx = cx + (Math.random()-.5)*rx*.4;
        const jy = cy + (Math.random()-.5)*ry*.4;
        const erx = rx * (.6 + Math.random()*.7);
        const ery = ry * (.6 + Math.random()*.7);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(jx, jy, erx, ery, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });

    // Lighter haze layer
    ctx.save();
    ctx.filter = "blur(30px)";
    ctx.fillStyle = "rgba(220,232,248,0.1)";
    ctx.beginPath();
    ctx.ellipse(W*.5, H*.5, W*.7, H*.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  paint();
  window.addEventListener("resize", paint);
})();

/* ════════════════════════
   FLOATING DOODLES
════════════════════════ */
(function spawnDoodles() {
  const layer = document.getElementById("doodleLayer");

  function flower(size) {
    const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 40 40");
    s.setAttribute("width", size); s.setAttribute("height", size);
    s.innerHTML = `
      <g fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round">
        <circle cx="20" cy="12" r="5"/>
        <circle cx="28" cy="20" r="5"/>
        <circle cx="20" cy="28" r="5"/>
        <circle cx="12" cy="20" r="5"/>
        <circle cx="20" cy="20" r="4" stroke="rgba(255,255,255,0.5)"/>
      </g>`;
    return s;
  }

  function star4(size) {
    const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 30 30");
    s.setAttribute("width", size); s.setAttribute("height", size);
    s.innerHTML = `
      <g stroke="rgba(255,255,255,0.7)" stroke-width="1.8" stroke-linecap="round">
        <line x1="15" y1="2"  x2="15" y2="28"/>
        <line x1="2"  y1="15" x2="28" y2="15"/>
        <line x1="6"  y1="6"  x2="24" y2="24" stroke-width="1"/>
        <line x1="24" y1="6"  x2="6"  y2="24" stroke-width="1"/>
      </g>`;
    return s;
  }

  function swirl(size) {
    const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 50 40");
    s.setAttribute("width", size*1.3); s.setAttribute("height", size);
    s.innerHTML = `
      <path d="M5,20 Q10,5 20,15 Q30,25 40,10 Q45,5 48,15"
        fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round"/>`;
    return s;
  }

  function cross(size) {
    const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 20 20");
    s.setAttribute("width", size*.6); s.setAttribute("height", size*.6);
    s.innerHTML = `
      <g stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="2" x2="18" y2="18"/>
        <line x1="18" y1="2" x2="2" y2="18"/>
      </g>`;
    return s;
  }

  const factories = [flower, star4, swirl, cross];
  const count = 18;

  for (let i = 0; i < count; i++) {
    const wrap = document.createElement("div");
    wrap.className = "doodle";
    const size = Math.random() * 22 + 14;
    const fn = factories[Math.floor(Math.random() * factories.length)];
    wrap.appendChild(fn(size));

    wrap.style.left  = `${Math.random() * 95}vw`;
    wrap.style.top   = `${Math.random() * 90}vh`;
    wrap.style.setProperty("--dur",   `${Math.random()*7 + 6}s`);
    wrap.style.setProperty("--delay", `${Math.random()*8}s`);
    wrap.style.transform = `rotate(${Math.random()*360}deg)`;
    layer.appendChild(wrap);
  }
})();

/* ════════════════════════

(function() {
  const g = document.getElementById("grooves");

const bgAudio = document.getElementById("bgAudio");
bgAudio.volume = document.getElementById("volSlider").value / 100;

/* ════════════════════════
   DISC TOGGLE
════════════════════════ */
let discPaused = true;

// UI always follows audio state — not the other way around
function setDiscPlaying(playing) {
  discPaused = !playing;
  const disc     = document.getElementById("vinylDisc");
  const pauseBtn = document.getElementById("pauseBtn");
  const playBtn  = document.getElementById("playBtn");
  const eqBars   = document.getElementById("eqBars");
  const npLabel  = document.getElementById("nowPlayingLabel");
  const npBadge  = document.getElementById("npBadge");

  if (playing) {
    disc.classList.remove("paused");
    pauseBtn.style.display = "flex";
    playBtn.style.display  = "none";
    eqBars.classList.add("visible");
    npLabel.classList.add("visible");
    npBadge.classList.add("visible");
  } else {
    disc.classList.add("paused");
    pauseBtn.style.display = "none";
    playBtn.style.display  = "flex";
    eqBars.classList.remove("visible");
    npLabel.classList.remove("visible");
    npBadge.classList.remove("visible");
  }
}

// Audio events drive the UI
bgAudio.addEventListener("play",    () => setDiscPlaying(true));
bgAudio.addEventListener("playing", () => setDiscPlaying(true));
bgAudio.addEventListener("pause",   () => setDiscPlaying(false));
bgAudio.addEventListener("ended",   () => setDiscPlaying(false));

// Initialize: disc paused, play button visible
setDiscPlaying(false);

// Try autoplay — if browser allows it, events above will flip the UI
bgAudio.play().catch(() => {
  // Blocked — disc stays paused, user clicks play button
});

// Toggle: just control audio; events handle disc UI
function toggleDisc() {
  if (bgAudio.paused) {
    bgAudio.play().catch(() => {});
  } else {
    bgAudio.pause();
  }
}

/* ════════════════════════
   BEAT BAR — cột sóng theo nhịp nhạc
   (Web Audio chỉ bật được sau cú chạm/bấm đầu tiên;
    trước đó cột sóng chạy mô phỏng nếu nhạc đã tự phát)
════════════════════════ */
(function beatBar() {
  const cv  = document.getElementById("beatBar");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  window.addEventListener("resize", size);

  let actx = null, analyser = null, data = null;
  // Chỉ nối nhạc vào bộ phân tích khi AudioContext đang chạy,
  // để không bao giờ làm tắt tiếng nhạc nếu trình duyệt chưa cho phép.
  async function initAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!actx) actx = new AC();
      if (actx.state !== "running") await Promise.race([actx.resume(), new Promise(r => setTimeout(r, 300))]);
      if (actx.state !== "running" || analyser) return;
      const src = actx.createMediaElementSource(bgAudio);
      analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.6;
      analyser.minDecibels = -85;
      analyser.maxDecibels = -12;
      src.connect(analyser);
      analyser.connect(actx.destination);
      data = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { /* giữ nguyên, cột sóng chạy mô phỏng */ }
  }
  ["pointerdown", "keydown", "touchstart"].forEach(ev =>
    window.addEventListener(ev, initAudio, { passive: true }));
  bgAudio.addEventListener("playing", initAudio);

  /* Sóng phổ tần đối xứng, gom ở giữa trang:
     bass ở chính giữa → tiếng cao toả ra hai bên rồi mờ dần.
     Không có nhạc: chỉ còn hàng chấm nhỏ. Có nhạc: cột cao theo độ to thật.
     Thêm chấm đỉnh rơi chậm + bóng phản chiếu mờ cho hợp kiểu kính của trang. */
  const BAR = 4, GAP = 5, DOT = 3;
  let levels = [], peaks = [], prev = 0;

  function frame(t) {
    const dt = Math.min(3, (t - prev) / 16.7 || 1);   // bù khi máy chậm
    prev = t;
    let n = Math.max(3, Math.floor(W / (BAR + GAP)));
    if (n % 2 === 0) n -= 1;                           // số lẻ để có đúng một cột giữa
    if (levels.length !== n) { levels = new Array(n).fill(0); peaks = new Array(n).fill(0); }
    const playing = !bgAudio.paused && !bgAudio.muted && bgAudio.volume > 0;
    const live = analyser && actx.state === "running";
    if (live) analyser.getByteFrequencyData(data);
    const vol = Math.max(0.25, bgAudio.volume);        // để thanh âm lượng nhỏ vẫn thấy sóng

    const BASE = H * 0.74;                             // đường chân cột
    const MAXH = BASE - 8;
    const half = (n - 1) / 2;
    const offset = (W - n * (BAR + GAP)) / 2;
    const usable = data ? data.length * 0.5 : 0;       // bỏ phần tần số quá cao (gần như im)

    ctx.clearRect(0, 0, W, H);

    // đường chân mảnh, sáng ở giữa
    const line = ctx.createLinearGradient(0, 0, W, 0);
    line.addColorStop(0, "rgba(255,255,255,0)");
    line.addColorStop(0.5, "rgba(255,255,255,0.22)");
    line.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = line;
    ctx.fillRect(0, BASE + 1, W, 1);

    // màu cột: sáng ở đỉnh, nhạt dần xuống chân
    const fill = ctx.createLinearGradient(0, BASE - MAXH, 0, BASE);
    fill.addColorStop(0, "rgba(255,255,255,0.95)");
    fill.addColorStop(1, "rgba(235,232,225,0.4)");
    const mirror = ctx.createLinearGradient(0, BASE, 0, H);
    mirror.addColorStop(0, "rgba(255,255,255,0.16)");
    mirror.addColorStop(1, "rgba(255,255,255,0)");

    for (let i = 0; i < n; i++) {
      const p = Math.abs(i - half) / half;             // 0 giữa (bass) → 1 mép (treble)
      let target = 0;
      if (playing && live) {
        const bin = Math.min(data.length - 1, 1 + Math.floor(Math.pow(p, 2.6) * usable));
        target = Math.pow(data[bin] / 255, 1.8) * (1 + p * 1.6) / (vol * 0.6 + 0.4);
      } else if (playing) {
        // chưa đọc được âm thanh (trình duyệt chặn) → sóng mô phỏng, cao ở giữa
        const env = Math.exp(-p * 2.6);
        target = env * (0.25 + 0.55 * Math.abs(Math.sin(t / 210 + p * 9) * Math.sin(t / 470 + p * 4)));
      }
      target = Math.min(1, target);
      const k = target > levels[i] ? 0.7 : 0.22;       // lên nhanh, rơi nhanh
      levels[i] += (target - levels[i]) * Math.min(1, k * dt);
      peaks[i] = Math.max(levels[i], peaks[i] - 0.008 * dt);

      const fade = 1 - Math.pow(p, 1.6) * 0.85;        // mờ dần về hai mép
      const x = offset + i * (BAR + GAP) + GAP / 2;
      const h = levels[i] * MAXH;
      ctx.globalAlpha = fade;

      if (h < DOT + 0.5) {                             // im lặng: chấm nhỏ
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.fillRect(x + (BAR - DOT) / 2, BASE - DOT, DOT, DOT);
        continue;
      }

      // cột chính
      ctx.shadowColor = "rgba(255,255,255,0.6)";
      ctx.shadowBlur = 10;
      ctx.fillStyle = fill;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, BASE - h, BAR, h, [BAR / 2, BAR / 2, 0, 0]);
      else ctx.rect(x, BASE - h, BAR, h);
      ctx.fill();

      // bóng phản chiếu
      ctx.shadowBlur = 0;
      ctx.fillStyle = mirror;
      ctx.fillRect(x, BASE + 3, BAR, Math.min(h * 0.4, H - BASE - 3));

      // chấm đỉnh rơi chậm
      if (peaks[i] * MAXH > h + 3) {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.fillRect(x, BASE - peaks[i] * MAXH - 3, BAR, 2);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

function renderFeatured() {
  const el = document.getElementById("featInfo");
  if (!featured) {
    el.innerHTML = `
      <div class="rec-num" style="font-size:1.4rem">tuần này,</div>
      <div class="rec-by">Archive tạm đóng cửa.</div>
      <div class="rec-desc" style="margin-top:.6rem">Thư viện cần sắp xếp lại một vài kệ sách.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="rec-num">Stream Week #${featured.id}</div>
    <div class="rec-by">Zi Eer · ${featured.date}</div>
    <div class="rec-desc">${featured.desc}</div>
    <a class="rec-more">đọc thêm..</a>`;
}

/* ════════════════════════
   RENDER SCHEDULE
════════════════════════ */
function renderSchedule() {
  document.getElementById("weekLabel").textContent = `tuần ${WEEK_OF}`;
  const list = document.getElementById("schedList");
  list.innerHTML = "";

  WEEK_SCHEDULE.forEach(d => {
    const row = document.createElement("div");
    row.className = `srow ${d.status}`;
    const label = d.status === "tba" ? "— TBA" : "Offline";
    row.innerHTML = `
      <div class="day-badge">
        <div class="day-name">${d.day}</div>
        <div class="day-date">${d.date}</div>
      </div>
      <div class="day-div"></div>
      <div class="srow-info">
        <div class="srow-activity">${d.status==="stream" ? d.activity : label}</div>
        ${d.note ? `<div class="srow-sub">${d.note}</div>` : ""}
      </div>
      ${d.status==="stream" && d.time ? `<div class="time-badge">${d.time}</div>` : ""}
    `;
    list.appendChild(row);
  });
}

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").toLowerCase();
const shortUrl = u => u.replace(/^https?:\/\/(www\.)?/, "");

/* ── HOME: overlay with every link ── */
(function buildLinks() {
  const grid = document.getElementById("linksGrid");
  grid.innerHTML = LINKS.map(l => `
    <a class="ltile s${l.span}" href="${l.url}" target="_blank" rel="noopener"
       style="--gx:${l.gx};--gy:${l.gy};--img:url('./links/${l.key}.jpg');--pos:${l.pos || "center"}">
      <span class="lt-arrow">↗</span>
      <span class="lt-mark">${ICONS[l.key]}</span>
      <span class="lt-foot">
        <span class="lt-ico">${ICONS[l.key]}</span>
        <span><span class="lt-label">${l.label}</span><br><span class="lt-handle">${l.handle}</span></span>
      </span>
    </a>`).join("");

  const overlay = document.getElementById("linksOverlay");
  const open  = () => { overlay.classList.add("open");    overlay.setAttribute("aria-hidden", "false"); };
  const close = () => { overlay.classList.remove("open"); overlay.setAttribute("aria-hidden", "true"); };
  document.getElementById("navHome").addEventListener("click", e => { e.preventDefault(); open(); });
  document.getElementById("linksClose").addEventListener("click", close);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
})();

/* ── SEARCH: tìm liên kết ── */
(function linkSearch() {
  const inp = document.getElementById("searchInp");
  const box = document.getElementById("searchResults");
  let matches = [], hl = 0;

  function render() {
    const q = norm(inp.value.trim());
    matches = LINKS.filter(l => !q || norm(`${l.label} ${l.handle} ${l.url} ${l.kw}`).includes(q));
    hl = 0;
    box.innerHTML = matches.length
      ? matches.map((l, i) => `
          <a class="sr-item${i === hl ? " hl" : ""}" href="${l.url}" target="_blank" rel="noopener" role="option">
            <span class="sr-ico">${ICONS[l.key]}</span>
            <span class="sr-txt"><div class="sr-name">${l.label} · ${l.handle}</div><div class="sr-url">${shortUrl(l.url)}</div></span>
            <span class="sr-go">↗</span>
          </a>`).join("")
      : `<div class="sr-empty">không thấy liên kết nào khớp “${inp.value}”.</div>`;
    box.classList.add("open");
  }
  function moveHl(d) {
    if (!matches.length) return;
    hl = (hl + d + matches.length) % matches.length;
    box.querySelectorAll(".sr-item").forEach((el, i) => el.classList.toggle("hl", i === hl));
  }

  inp.addEventListener("focus", render);
  inp.addEventListener("input", render);
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); moveHl(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveHl(-1); }
    else if (e.key === "Enter" && matches[hl]) window.open(matches[hl].url, "_blank", "noopener");
    else if (e.key === "Escape") { box.classList.remove("open"); inp.blur(); }
  });
  document.addEventListener("click", e => {
    if (!e.target.closest(".search-bar")) box.classList.remove("open");
  });
  document.querySelector(".search-x").addEventListener("click", () => {
    inp.value = ""; inp.focus(); render();
  });
})();

renderFeatured();
renderSchedule();
